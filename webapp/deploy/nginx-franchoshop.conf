# /etc/nginx/sites-available/franchoshop
# Subdominio shop.tudominio.com
#
# Pasos:
#   1. Editar 'shop.tudominio.com' por tu dominio real
#   2. ln -s /etc/nginx/sites-available/franchoshop /etc/nginx/sites-enabled/
#   3. certbot --nginx -d shop.tudominio.com
#   4. nginx -t && systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name shop.tudominio.com;

    # SSL (después de certbot)
    ssl_certificate /etc/letsencrypt/live/shop.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/franchoshop-access.log;
    error_log /var/log/nginx/franchoshop-error.log;
    client_max_body_size 25m;

    # ═══════ Frontend React (SPA) ═══════
    root /root/gamestore/webapp/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Headers de seguridad para Telegram WebApp
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors *.telegram.org telegram.org" always;
    }

    # ═══════ API FastAPI ═══════
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        proxy_read_timeout 60s;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# Redirección HTTP → HTTPS
server {
    listen 80;
    server_name shop.tudominio.com;
    return 301 https://$host$request_uri;
}
