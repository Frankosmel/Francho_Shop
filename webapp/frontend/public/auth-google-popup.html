<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso con Google — Francho Shop</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    p {
      color: rgba(255, 255, 255, 0.65);
      font-size: 13px;
      margin: 0 0 24px 0;
      line-height: 1.45;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      min-height: 48px;
      margin-bottom: 14px;
    }
    .status {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.5);
      min-height: 20px;
      line-height: 1.4;
    }
    .success {
      color: #34d399;
      font-weight: 700;
    }
    .error {
      color: #f87171;
      font-weight: 600;
    }
    .action-btn {
      display: none;
      margin-top: 16px;
      background: #22c55e;
      color: #0b0f19;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.1s;
    }
    .action-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
    </div>
    <h2>Acceso Seguro con Google</h2>
    <p>Elige tu cuenta de Google para iniciar sesión o registrarte en Francho Shop.</p>
    <div id="g_btn" class="btn-container"></div>
    <div id="status" class="status">Cargando cuentas de Google...</div>
    <a id="btn_back" class="action-btn" href="/">Entrar a Francho Shop</a>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = "1064239228300-nbntbj1rvv1o8rkl4je9ccraj6glsqsv.apps.googleusercontent.com";
    const urlParams = new URLSearchParams(window.location.search);
    const targetOrigin = urlParams.get('origin') || '*';
    const isNativeReturn = urlParams.get('native') === '1';

    async function handleCredentialResponse(response) {
      if (!response || !response.credential) return;

      const statusEl = document.getElementById('status');
      const backBtn = document.getElementById('btn_back');
      statusEl.className = 'status success';
      statusEl.innerText = '✅ ¡Autenticación exitosa! Conectando...';

      const credential = response.credential;

      // The native app receives the credential through its deep link and creates
      // the session in its own secure storage. The browser never stores that token.
      if (!isNativeReturn) {
        try {
          const res = await fetch('/api/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.token) {
              try { localStorage.setItem('fs_token', data.token); } catch(e){}
            }
          }
        } catch (err) {
          console.warn('Pre-auth error:', err);
        }
      }

      // 2. Si se abrió como Popup desde la web principal
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: 'FRANCHOSHOP_GOOGLE_AUTH_SUCCESS',
            credential: credential
          }, targetOrigin === '*' ? '*' : targetOrigin);
          setTimeout(() => {
            try { window.close(); } catch(e){}
          }, 500);
          return;
        } catch (e) {
          console.warn('Error en postMessage:', e);
        }
      }

      // 3. Si se abrió desde la app Android (Capacitor)
      const isApp = isNativeReturn || window.Capacitor?.isNativePlatform?.() || /franchoshop/i.test(navigator.userAgent);
      if (isApp) {
        window.location.href = "franchoshop://auth?credential=" + encodeURIComponent(credential);
        setTimeout(() => {
          if (backBtn) backBtn.style.display = 'inline-block';
        }, 1000);
        return;
      }

      // 4. Redirección web estándar a la tienda
      if (backBtn) backBtn.style.display = 'inline-block';
      setTimeout(() => {
        window.location.href = "/";
      }, 400);
    }

    function init() {
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        setTimeout(init, 100);
        return;
      }
      try {
        window.google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleCredentialResponse,
          auto_select: false,
          cancel_on_tap_outside: true,
          // Evita el popup about:blank del flujo clásico de Google en Chrome.
          use_fedcm_for_button: true
        });
        window.google.accounts.id.renderButton(
          document.getElementById('g_btn'),
          {
            theme: 'filled_black',
            size: 'large',
            shape: 'pill',
            text: 'continue_with',
            width: 290,
            locale: 'es'
          }
        );
        window.google.accounts.id.prompt();
        document.getElementById('status').innerText = '';
      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = 'Error al inicializar Google Auth.';
      }
    }
    window.addEventListener('load', init);
  </script>
</body>
</html>
