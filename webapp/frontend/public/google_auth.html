<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Francho Shop — Acceso con Google</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .logo-badge {
      width: 60px;
      height: 60px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px auto;
    }
    h2 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    #google_btn_wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      margin-bottom: 16px;
    }
    .status-msg {
      font-size: 13px;
      color: #38bdf8;
      min-height: 20px;
      margin-top: 8px;
      font-weight: 500;
    }
    .fallback-btn {
      display: none;
      margin-top: 14px;
      background: #22c55e;
      color: #0b0f19;
      padding: 12px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <svg width="30" height="30" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
    </div>
    <h2>Acceder con Google</h2>
    <p>Inicia sesión o regístrate en Francho Shop de forma instantánea y segura.</p>

    <div id="google_btn_wrapper"></div>
    <div id="status_msg" class="status-msg">Cargando cuentas disponibles...</div>

    <a id="fallback_btn" class="fallback-btn" href="/">Entrar a Francho Shop</a>
  </div>

  <script>
    const CLIENT_ID = "1064239228300-nbntbj1rvv1o8rkl4je9ccraj6glsqsv.apps.googleusercontent.com";

    function setStatus(text, color) {
      const el = document.getElementById("status_msg");
      if (el) {
        el.innerText = text;
        if (color) el.style.color = color;
      }
    }

    async function handleGoogleCredential(res) {
      if (!res || !res.credential) return;
      setStatus("✅ ¡Cuenta verificada! Conectando...", "#34D399");

      const credential = res.credential;
      const fallbackBtn = document.getElementById("fallback_btn");

      // Guardar token en backend y localStorage
      try {
        const resp = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential })
        });
        if (resp.ok) {
          const data = await resp.json();
          if (data && data.token) {
            try { localStorage.setItem('fs_token', data.token); } catch(e){}
          }
        }
      } catch (err) {
        console.warn('Error en pre-auth:', err);
      }

      // Si fue popup web
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: "FRANCHOSHOP_GOOGLE_AUTH_SUCCESS",
            credential: credential
          }, "*");
          setTimeout(function() {
            try { window.close(); } catch (e) {}
          }, 500);
          return;
        } catch (e) {}
      }

      // Si es app Android
      const urlParams = new URLSearchParams(window.location.search);
      const isApp = window.Capacitor?.isNativePlatform?.() || /franchoshop/i.test(navigator.userAgent) || urlParams.get('app') === '1' || urlParams.get('native') === '1';
      if (isApp) {
        const appDeepLink = "franchoshop://auth?credential=" + encodeURIComponent(credential);
        if (fallbackBtn) {
          fallbackBtn.innerText = "Toca para abrir Francho Shop";
          fallbackBtn.href = appDeepLink;
          fallbackBtn.style.display = "inline-block";
        }
        window.location.href = appDeepLink;
        return;
      }

      // Web
      if (fallbackBtn) fallbackBtn.style.display = "inline-block";
      setTimeout(function() {
        window.location.href = "/";
      }, 400);
    }

    function initGoogle() {
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        setTimeout(initGoogle, 120);
        return;
      }

      try {
        window.google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: handleGoogleCredential,
          auto_select: false,
          cancel_on_tap_outside: true,
          itp_support: true,
          use_fedcm_for_prompt: true
        });

        const btnWrap = document.getElementById("google_btn_wrapper");
        if (btnWrap) {
          btnWrap.innerHTML = "";
          window.google.accounts.id.renderButton(btnWrap, {
            theme: "filled_black",
            size: "large",
            shape: "pill",
            text: "continue_with",
            width: 290,
            locale: "es"
          });
        }

        window.google.accounts.id.prompt();
        setStatus("");
      } catch (err) {
        console.error(err);
        setStatus("Error al conectar con Google.", "#F87171");
      }
    }

    window.addEventListener("load", initGoogle);
  </script>
</body>
</html>
